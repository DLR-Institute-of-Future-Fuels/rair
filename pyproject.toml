[project]
name = "rair"
dynamic = ["version"]
description = "Simple data versioning"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.12.0",
    'tomli>=2.0.0; python_version < "3.11"',
]

[project.urls]
Repository = "https://github.com/DLR-Institute-of-Future-Fuels/rair.git"
Issues = "https://github.com/DLR-Institute-of-Future-Fuels/rair/issues"

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.8.0",
]

[project.scripts]
rair = "rair.cli:app"

[tool.setuptools]
packages = ["rair"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
files = ["rair"]
